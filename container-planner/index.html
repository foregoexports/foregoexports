<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Container Stuffing Planner | Forego Exports</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-shell">

    <header class="app-header">
      <div>
        <p class="eyebrow">FOREGO EXPORTS</p>
        <h1>Container Stuffing Planner</h1>
      </div>

      <button id="newPlanBtn">
        + New Stuffing Plan
      </button>
    </header>


    <section class="dashboard">

      <div class="card">
        <h2>Saved Plans</h2>

        <div id="plansList">
          Loading plans...
        </div>
      </div>


      <div class="card">
        <h2>Container Presets</h2>

        <div id="containersList">
          Loading containers...
        </div>
      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
